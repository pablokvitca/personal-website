# pnpm settings (pnpm 11+ no longer reads the `pnpm` field in package.json or non-auth .npmrc keys).

# Floors for transitive security fixes. https://pnpm.io/settings/dependency-resolution#overrides
overrides:
  ajv@<6.14.0: ^6.14.0
  ajv@>=7 <8.18.0: ^8.18.0
  h3: ^1.15.9
  undici: ^7.29.0
  devalue: ^5.9.2
  svgo: ^4.1.0
  dompurify: ^3.4.13
  fast-uri: ^3.1.6
  fflate: ^0.4.9
  sharp: ^0.35.5
  deepmerge-ts: ^8.0.2

# Hoist @arcjet/* packages so the @arcjet/astro virtual module can resolve them
# at build time. The integration inlines internal.js as a virtual module string,
# which loses its node_modules context under pnpm's strict resolution.
# https://pnpm.io/settings/node-modules#publichoistpattern
publicHoistPattern:
  - '@arcjet/*'
  - arcjet

# pnpm 11+ fails the install on unreviewed dependency build scripts (pnpm 10 only skipped them).
# None of these ever ran under pnpm 10: esbuild and workerd get their binaries from per-platform
# optional dependencies, and core-js's script only prints a banner. https://pnpm.io/settings/build#allowbuilds
allowBuilds:
  core-js: false
  esbuild: false
  workerd: false
