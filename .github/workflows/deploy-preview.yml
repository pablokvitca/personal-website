name: Deploy Preview

# Comment "/deploy" on a PR to upload it as a Worker version with a pr-<number>
# preview alias. Previews never receive production traffic.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  authorize:
    if: >
      github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/deploy')
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed('Commenter does not have write access.');
            }

      - name: Get PR head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('head_sha', pr.head.sha);

  # Builds the PR's code without access to any secrets.
  build:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          ARCJET_KEY: ajkey_build_placeholder

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: dist
          include-hidden-files: true
          retention-days: 3

  # Uploads the version using wrangler from the trusted default branch.
  deploy:
    needs: [authorize, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: dist

      - name: Verify generated Worker config
        # The config comes from the PR build; refuse anything beyond the expected Worker and assets.
        run: |
          jq -e '
            .name == "pablokvitca-website"
            and ((.kv_namespaces // []) | length == 0)
            and ((.d1_databases // []) | length == 0)
            and ((.r2_buckets // []) | length == 0)
            and ((.services // []) | length == 0)
            and ((.durable_objects.bindings // []) | length == 0)
            and ((.routes // []) | length == 0)
          ' dist/server/wrangler.json

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          pnpm exec wrangler versions upload \
            --config dist/server/wrangler.json \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER}" | tee upload.log
          url=$(grep -oE 'https://pr-[0-9]+-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -n1)
          if [ -z "$url" ]; then echo "Could not find preview alias URL in wrangler output" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Preview for ${process.env.HEAD_SHA.slice(0, 7)} deployed: ${process.env.PREVIEW_URL}`,
            });
