name: Deploy Preview

# Comment "/deploy" on a PR to upload it as a version of the separate
# pablokvitca-website-preview Worker, under a pr-<number> preview alias.
#
# Threat model: the PR's code is untrusted. It is built in a job with no secrets
# and no shared cache, and nothing from that build is used as Wrangler config
# (Wrangler can run a `build.command` from config). The preview Worker holds no
# production secrets, so preview code cannot read them at runtime.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  PREVIEW_WORKER: pablokvitca-website-preview

jobs:
  authorize:
    if: >
      github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/deploy')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed('Commenter does not have write access.');
            }

      - name: Get PR head SHA
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('head_sha', pr.head.sha);

  # Builds the PR's code: no secrets, read-only token, no dependency cache
  # (a cache written here would be restored by trusted jobs on main).
  build:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          ARCJET_KEY: ajkey_build_placeholder

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-build
          path: |
            dist/server/*.mjs
            dist/server/chunks
            dist/server/_astro
            dist/client
          include-hidden-files: true
          retention-days: 3

  # Uploads the version with wrangler and config from the trusted default branch.
  deploy:
    needs: [authorize, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-build
          path: preview

      - name: Write trusted Worker config
        # Only values from the default branch; never the PR build's generated wrangler.json.
        run: |
          test -f preview/server/entry.mjs
          test -d preview/client
          compat_date=$(sed '/^[[:space:]]*\/\//d' wrangler.jsonc | jq -r '.compatibility_date')
          jq -n --arg name "$PREVIEW_WORKER" --arg date "$compat_date" '{
            name: $name,
            main: "entry.mjs",
            compatibility_date: $date,
            compatibility_flags: [],
            no_bundle: true,
            rules: [{ type: "ESModule", globs: ["**/*.js", "**/*.mjs"] }],
            assets: { binding: "ASSETS", directory: "../client" },
            workers_dev: false,
            preview_urls: true
          }' > preview/server/wrangler.preview.json

      - name: Ensure preview Worker exists
        # `versions upload` cannot create a Worker; deploy a trusted 404 placeholder once.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm exec wrangler deployments list --name "$PREVIEW_WORKER" > /dev/null 2>&1; then
            exit 0
          fi
          mkdir -p placeholder
          echo 'export default { fetch() { return new Response("Not found", { status: 404 }); } };' > placeholder/index.mjs
          jq -n --arg name "$PREVIEW_WORKER" '{ name: $name, main: "index.mjs", compatibility_date: "2026-09-26", workers_dev: false, preview_urls: true }' > placeholder/wrangler.json
          pnpm exec wrangler deploy --config placeholder/wrangler.json

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          pnpm exec wrangler versions upload \
            --config preview/server/wrangler.preview.json \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER}" | tee upload.log
          url=$(grep -oE "https://pr-${PR_NUMBER}-${PREVIEW_WORKER}\.[a-z0-9-]+\.workers\.dev" upload.log | head -n1)
          if [ -z "$url" ]; then echo "Could not find preview alias URL in wrangler output" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Preview for ${process.env.HEAD_SHA.slice(0, 7)} deployed: ${process.env.PREVIEW_URL}`,
            });
